      <article>
        <h2>一、退货条件</h2>
        <p>退货申请需要在签收后七天内提交，逾期不再
        受理。商品须保持原状，配件、赠品与
        包装一并寄回。</p>
        <ul>
          <li>定制类商品不支持七天无理由退货</li>
          <li>生鲜、软件授权与虚拟商品不支持退货</li>
        </ul>
        <h2>二、退款到账</h2>
        <p>仓库验收通过后 1&ndash;3 个工作日内发起退款，到账时间取决于
        发卡银行，通常为 3&ndash;5 个工作日。</p>
        <table>
          <tr><th>支付方式</th><th>退款时限</th></tr>
          <tr><td>银行卡</td><td>3&ndash;5 个工作日</td></tr>
          <tr><td>余额</td><td>实时</td></tr>
        </table>
      </article>
